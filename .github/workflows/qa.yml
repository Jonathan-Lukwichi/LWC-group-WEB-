name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Fails the build on any horizontal overflow (down to 320px) or console error.
      - run: npm run test:qa
